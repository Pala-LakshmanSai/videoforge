[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "videoforge-contracts"
version = "0.0.0"
description = "Canonical Draft 2020-12 and Pydantic v2 contracts for VideoForge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
