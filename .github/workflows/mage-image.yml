name: mage-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the smoke-tested immutable image to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: mage-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      immutable_image: ${{ steps.publish.outputs.immutable_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim only disposable hosted-runner tool space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for target in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [[ -e "$target" ]]; then
              sudo rm -rf -- "$target"
            fi
          done
          docker system prune --all --force
          df -h /

      - name: Build and smoke V2-07 repaired Mage INT8 Serverless candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "X64"
          image="videoforge-mage-v2-07:${GITHUB_SHA}"
          docker build --platform linux/amd64 --file workers/image-media/Dockerfile.mage.repair --tag "$image" .
          architecture="$(docker image inspect --format='{{.Architecture}}' "$image")"
          operating_system="$(docker image inspect --format='{{.Os}}' "$image")"
          test "$architecture" = "amd64"
          test "$operating_system" = "linux"
          source_commit="$(docker image inspect --format='{{index .Config.Labels "ai.videoforge.source-commit"}}' "$image")"
          test "$source_commit" = "431198333a22d66ad1929244bf92662c53be5a6b"
          base_digest="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "$image")"
          test "$base_digest" = "sha256:ab5043715f422c20ad1190f063c4f9e66f0d73907738c1ff185ab4d37a57af4e"
          docker run --rm --entrypoint python "$image" -c \
            'import torch; from videoforge_image_media import MAGE_MODEL_REVISION, MAGE_SOURCE_REVISION; assert MAGE_MODEL_REVISION == "d8c99241f6fa80fbd453014234af2bf337ea21e6"; assert MAGE_SOURCE_REVISION == "26d7f8556822d9d08c2d3e1878636ac3b4969af9"; print("mage-int8-comfy-import-ok")'
          docker run --rm --entrypoint python "$image" -c \
            'import videoforge_contracts; import mage_serverless; assert callable(mage_serverless.handler); assert mage_serverless._FAILURE_CODE.fullmatch("MAGE_SERVERLESS_JOB_SHAPE_INVALID"); print("mage-serverless-repaired-handler-import-ok")'
          docker run --rm --entrypoint python "$image" -m compileall -q /opt/comfyui /opt/videoforge
          image_id="$(docker image inspect --format='{{.Id}}' "$image")"
          echo "LOCAL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "image_id=$image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "publication_requested=${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate GHCR
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish smoke-tested immutable image
        id: publish
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/videoforge-mage-v2-07:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image"
          docker push "$image"
          immutable_image="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          [[ "$immutable_image" =~ ^ghcr\.io/[a-z0-9_-]+/videoforge-mage-v2-07@sha256:[a-f0-9]{64}$ ]]
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "immutable_image=$immutable_image" >> "$GITHUB_STEP_SUMMARY"
