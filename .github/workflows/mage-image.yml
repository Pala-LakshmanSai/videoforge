name: mage-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the smoke-tested immutable image to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: mage-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      immutable_image: ${{ steps.publish.outputs.immutable_image }}
      deployability_record_sha256: ${{ steps.record.outputs.deployability_record_sha256 }}
      evidence_artifact: ${{ steps.record.outputs.evidence_artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim only disposable hosted-runner tool space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for target in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [[ -e "$target" ]]; then
              sudo rm -rf -- "$target"
            fi
          done
          docker system prune --all --force
          df -h /

      - name: Derive exact deterministic V2-07 OCI overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          parent_digest="sha256:91ef608fbb15bc69213c73a598a8915fa4dfa938d02c619454e42319a6475f62"
          parent_config_digest="sha256:2aa6c2d124fe299502e3142e4f66d9d627855a3c63eda30b806febb588ec4bb2"
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_epoch" =~ ^[0-9]+$ ]]
          created="$(date -u -d "@$source_epoch" +'%Y-%m-%dT%H:%M:%SZ')"
          overlay_dir="$RUNNER_TEMP/v207-mage-oci-overlay"
          mkdir -p "$overlay_dir/input" "$overlay_dir/output"
          registry_token="$(
            curl -fsSL \
              'https://ghcr.io/token?service=ghcr.io&scope=repository:pala-lakshmansai/videoforge-mage-v2-07:pull' \
              | jq -r '.token'
          )"
          test -n "$registry_token"
          curl -fsSL \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/pala-lakshmansai/videoforge-mage-v2-07/manifests/$parent_digest" \
            -o "$overlay_dir/input/manifest.json"
          curl -fsSL \
            -H "Authorization: Bearer $registry_token" \
            "https://ghcr.io/v2/pala-lakshmansai/videoforge-mage-v2-07/blobs/$parent_config_digest" \
            -o "$overlay_dir/input/config.json"
          unset registry_token
          python3 workers/image-media/build_mage_oci_overlay.py \
            --base-manifest "$overlay_dir/input/manifest.json" \
            --base-config "$overlay_dir/input/config.json" \
            --source workers/image-media/mage_serverless.py \
            --source workers/common/serverless_envelope.py \
            --source packages/contracts/python/videoforge_contracts/_schema_documents.py \
            --destination /opt/videoforge/mage_serverless.py \
            --destination /opt/videoforge/common/serverless_envelope.py \
            --destination /opt/videoforge/src/videoforge_contracts/_schema_documents.py \
            --source-commit "$GITHUB_SHA" \
            --parent-image "ghcr.io/pala-lakshmansai/videoforge-mage-v2-07@$parent_digest" \
            --created "$created" \
            --output-dir "$overlay_dir/output"
          expected_manifest_digest="$(jq -r '.manifest_digest' "$overlay_dir/output/identity.json")"
          expected_config_digest="$(jq -r '.config_digest' "$overlay_dir/output/identity.json")"
          expected_layer_digest="$(jq -r '.layer_digest' "$overlay_dir/output/identity.json")"
          [[ "$expected_manifest_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$expected_config_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$expected_layer_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(jq -r '.source_commit' "$overlay_dir/output/identity.json")" = "$GITHUB_SHA"
          python3 workers/image-media/publish_mage_oci_overlay.py \
            --output-dir "$overlay_dir/output" \
            --repository pala-lakshmansai/videoforge-mage-v2-07 \
            --tag "v2-07-lineage-${GITHUB_SHA:0:12}"
          echo "MAGE_OCI_OUTPUT_DIR=$overlay_dir/output" >> "$GITHUB_ENV"
          echo "MAGE_OCI_BASE_MANIFEST=$overlay_dir/input/manifest.json" >> "$GITHUB_ENV"
          echo "MAGE_OCI_BASE_CONFIG=$overlay_dir/input/config.json" >> "$GITHUB_ENV"
          echo "MAGE_EXPECTED_MANIFEST_DIGEST=$expected_manifest_digest" >> "$GITHUB_ENV"
          echo "MAGE_EXPECTED_CONFIG_DIGEST=$expected_config_digest" >> "$GITHUB_ENV"
          echo "MAGE_EXPECTED_LAYER_DIGEST=$expected_layer_digest" >> "$GITHUB_ENV"
          echo "candidate_manifest_digest=$expected_manifest_digest" >> "$GITHUB_STEP_SUMMARY"
          echo "qualification_status=REQUIRES_FRESH_LIVE_REQUALIFICATION" >> "$GITHUB_STEP_SUMMARY"
          echo "prior_qualification_reused=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and smoke V2-07 repaired Mage INT8 Serverless candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "X64"
          expected_source_commit="$GITHUB_SHA"
          [[ "$expected_source_commit" =~ ^[a-f0-9]{40}$ ]]
          # Pin the current checkout bytes copied into the image explicitly;
          # labels alone would allow a workflow change to silently drift.
          expected_source_hashes=(
            "workers/image-media/mage_serverless.py|026f2e9444d8a020a36282c36f7d0bd0931e74cf8bcea08430ffbe33412f87bd"
            "workers/common/serverless_envelope.py|34949be02521ec896c27794ad382cfa4d2bd6f1b799615716a5dc2b9ce2e41d0"
            "packages/contracts/python/videoforge_contracts/_schema_documents.py|08fd73862b7d79f685dfaf1b72dd6b1e41468f3f581ad766ffea1f85c9dbf66f"
          )
          for source_entry in "${expected_source_hashes[@]}"; do
            source_path="${source_entry%%|*}"
            expected_hash="${source_entry#*|}"
            test "$(sha256sum "$source_path" | awk '{print $1}')" = "$expected_hash"
          done
          image="videoforge-mage-v2-07:${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --build-arg "VIDEOFORGE_SOURCE_COMMIT=$expected_source_commit" \
            --file workers/image-media/Dockerfile.mage.repair --tag "$image" .
          architecture="$(docker image inspect --format='{{.Architecture}}' "$image")"
          operating_system="$(docker image inspect --format='{{.Os}}' "$image")"
          test "$architecture" = "amd64"
          test "$operating_system" = "linux"
          source_commit="$(docker image inspect --format='{{index .Config.Labels "ai.videoforge.source-commit"}}' "$image")"
          test "$source_commit" = "$expected_source_commit"
          base_digest="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "$image")"
          test "$base_digest" = "sha256:91ef608fbb15bc69213c73a598a8915fa4dfa938d02c619454e42319a6475f62"
          docker run --rm --entrypoint python "$image" -c \
            'import torch; from videoforge_image_media import MAGE_MODEL_REVISION, MAGE_SOURCE_REVISION; assert MAGE_MODEL_REVISION == "d8c99241f6fa80fbd453014234af2bf337ea21e6"; assert MAGE_SOURCE_REVISION == "26d7f8556822d9d08c2d3e1878636ac3b4969af9"; print("mage-int8-comfy-import-ok")'
          docker run --rm --entrypoint python "$image" -c \
            'import videoforge_contracts; import mage_serverless; assert callable(mage_serverless.handler); assert mage_serverless._FAILURE_CODE.fullmatch("MAGE_SERVERLESS_JOB_SHAPE_INVALID"); print("mage-serverless-repaired-handler-import-ok")'
          docker run --rm --entrypoint python "$image" -c \
            'from videoforge_contracts._schema_documents import SCHEMA_DOCUMENTS; assert "timing_provenance" in SCHEMA_DOCUMENTS["serverlessProvenanceReceiptV1"]["properties"]["timings"]["properties"]; print("mage-timing-provenance-schema-import-ok")'
          docker run --rm --entrypoint python "$image" -m compileall -q /opt/comfyui /opt/videoforge
          image_id="$(docker image inspect --format='{{.Id}}' "$image")"
          echo "LOCAL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "image_id=$image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "publication_requested=${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and smoke exact deterministic candidate payload
        shell: bash
        run: |
          set -euo pipefail
          candidate_source="$RUNNER_TEMP/v207-candidate-mage_serverless.py"
          candidate_verification="$RUNNER_TEMP/v207-candidate-verification.json"
          candidate_schema="$RUNNER_TEMP/v207-candidate-schema-documents.py"
          expected_handler_sha="026f2e9444d8a020a36282c36f7d0bd0931e74cf8bcea08430ffbe33412f87bd"
          expected_envelope_sha="34949be02521ec896c27794ad382cfa4d2bd6f1b799615716a5dc2b9ce2e41d0"
          expected_schema_sha="08fd73862b7d79f685dfaf1b72dd6b1e41468f3f581ad766ffea1f85c9dbf66f"
          python3 workers/image-media/verify_mage_oci_overlay.py \
            --output-dir "$MAGE_OCI_OUTPUT_DIR" \
            --base-manifest "$MAGE_OCI_BASE_MANIFEST" \
            --base-config "$MAGE_OCI_BASE_CONFIG" \
            --expected-manifest-digest "$MAGE_EXPECTED_MANIFEST_DIGEST" \
            --expected-config-digest "$MAGE_EXPECTED_CONFIG_DIGEST" \
            --expected-layer-digest "$MAGE_EXPECTED_LAYER_DIGEST" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-source /opt/videoforge/mage_serverless.py\|sha256:$expected_handler_sha \
            --expected-source /opt/videoforge/common/serverless_envelope.py\|sha256:$expected_envelope_sha \
            --expected-source /opt/videoforge/src/videoforge_contracts/_schema_documents.py\|sha256:$expected_schema_sha \
            --expected-parent-image ghcr.io/pala-lakshmansai/videoforge-mage-v2-07@sha256:91ef608fbb15bc69213c73a598a8915fa4dfa938d02c619454e42319a6475f62 \
            --extract-source "$candidate_source" \
            --extract-source-file /opt/videoforge/src/videoforge_contracts/_schema_documents.py\|"$candidate_schema" > "$candidate_verification"
          test "$(jq -r '.manifest_digest' "$candidate_verification")" = \
            "$MAGE_EXPECTED_MANIFEST_DIGEST"
          test "$(sha256sum "$candidate_source" | awk '{print $1}')" = \
            "$expected_handler_sha"
          test "$(sha256sum "$candidate_schema" | awk '{print $1}')" = \
            "$expected_schema_sha"
          # Run the exact handler bytes extracted from the candidate layer against
          # the already-built pinned linux/amd64 runtime base. The candidate config
          # identity is checked above; this bind mount makes the runtime import use
          # the candidate layer payload rather than the Dockerfile copy.
          docker run --rm \
            --mount "type=bind,src=$candidate_source,dst=/opt/videoforge/mage_serverless.py,readonly" \
            --entrypoint python "$LOCAL_IMAGE" -c \
            'import videoforge_contracts; import mage_serverless; assert callable(mage_serverless.handler); assert mage_serverless._FAILURE_CODE.fullmatch("MAGE_SERVERLESS_JOB_SHAPE_INVALID"); print("mage-serverless-exact-candidate-import-ok")'
          docker run --rm \
            --mount "type=bind,src=$candidate_source,dst=/opt/videoforge/mage_serverless.py,readonly" \
            --entrypoint python "$LOCAL_IMAGE" -m py_compile /opt/videoforge/mage_serverless.py
          docker run --rm \
            --mount "type=bind,src=$candidate_schema,dst=/opt/videoforge/src/videoforge_contracts/_schema_documents.py,readonly" \
            --entrypoint python "$LOCAL_IMAGE" -c \
            'from videoforge_contracts._schema_documents import SCHEMA_DOCUMENTS; assert "timing_provenance" in SCHEMA_DOCUMENTS["serverlessProvenanceReceiptV1"]["properties"]["timings"]["properties"]'
          echo "exact_candidate_manifest_smoke=passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact smoke-tested immutable image
        id: publish
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY_OWNER,,}" = "pala-lakshmansai"
          publication="$(
            python3 workers/image-media/publish_mage_oci_overlay.py \
              --output-dir "$MAGE_OCI_OUTPUT_DIR" \
              --repository pala-lakshmansai/videoforge-mage-v2-07 \
              --tag "v2-07-lineage-${GITHUB_SHA:0:12}" \
              --publish
          )"
          test "$(jq -r '.manifest_digest' <<<"$publication")" = \
            "$MAGE_EXPECTED_MANIFEST_DIGEST"
          immutable_image="ghcr.io/pala-lakshmansai/videoforge-mage-v2-07@$MAGE_EXPECTED_MANIFEST_DIGEST"
          publication_state="$(jq -r '.publication_state' <<<"$publication")"
          [[ "$publication_state" =~ ^(PUBLISHED_NEW_DIGEST|EXACT_EXISTING_DIGEST_REUSED)$ ]]
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "MAGE_PUBLICATION_STATE=$publication_state" >> "$GITHUB_ENV"
          echo "immutable_image=$immutable_image" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove anonymous public pull visibility of exact Mage digest
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          repository="pala-lakshmansai/videoforge-mage-v2-07"
          anonymous_token="$(
            curl -fsSL \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
              | jq -r '.token'
          )"
          test -n "$anonymous_token"
          public_manifest="$RUNNER_TEMP/v207-public-manifest.json"
          public_headers="$RUNNER_TEMP/v207-public-manifest.headers"
          manifest_status="$(curl --fail --silent --show-error --location \
            --dump-header "$public_headers" --output "$public_manifest" --write-out '%{http_code}' \
            -H "Authorization: Bearer $anonymous_token" \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/$MAGE_EXPECTED_MANIFEST_DIGEST")"
          test "$manifest_status" = "200"
          public_digest="sha256:$(sha256sum "$public_manifest" | awk '{print $1}')"
          header_digest="$(awk 'BEGIN { IGNORECASE=1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2 }' "$public_headers" | tail -1)"
          response_content_type="$(awk 'BEGIN { IGNORECASE=1 } /^Content-Type:/ { gsub("\r", "", $2); split($2, value, ";"); print value[1] }' "$public_headers" | tail -1)"
          registry_observed_at="$(awk 'BEGIN { IGNORECASE=1 } /^Date:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print }' "$public_headers" | tail -1)"
          manifest_media_type="$(jq -r '.mediaType' "$public_manifest")"
          test "$public_digest" = "$MAGE_EXPECTED_MANIFEST_DIGEST"
          test "$header_digest" = "$MAGE_EXPECTED_MANIFEST_DIGEST"
          test "$manifest_media_type" = "application/vnd.docker.distribution.manifest.v2+json"
          test "$response_content_type" = "$manifest_media_type"
          test -n "$registry_observed_at"
          blob_proofs="$RUNNER_TEMP/v207-public-blob-proofs.tsv"
          : > "$blob_proofs"
          while IFS=$'\t' read -r kind index blob media_type declared_size; do
            [[ "$kind" = "config" || "$kind" = "layer" ]]
            [[ "$index" =~ ^[0-9]+$ ]]
            [[ "$blob" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$declared_size" =~ ^[1-9][0-9]*$ ]]
            blob_file="$RUNNER_TEMP/v207-public-${kind}-${index}.blob"
            blob_headers="$RUNNER_TEMP/v207-public-${kind}-${index}.headers"
            blob_status="$(curl --fail --silent --show-error --location \
              --dump-header "$blob_headers" --output "$blob_file" --write-out '%{http_code}' \
              -H "Authorization: Bearer $anonymous_token" \
              "https://ghcr.io/v2/${repository}/blobs/$blob")"
            test "$blob_status" = "200"
            observed_digest="sha256:$(sha256sum "$blob_file" | awk '{print $1}')"
            observed_size="$(stat -c%s "$blob_file")"
            blob_observed_at="$(awk 'BEGIN { IGNORECASE=1 } /^Date:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r", ""); print }' "$blob_headers" | tail -1)"
            test "$observed_digest" = "$blob"
            test "$observed_size" = "$declared_size"
            test -n "$blob_observed_at"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$kind" "$index" "$blob" "$media_type" "$declared_size" \
              "$observed_size" "$observed_digest" "$blob_status" "$blob_observed_at" \
              >> "$blob_proofs"
            rm -f -- "$blob_file"
          done < <(jq -r '
            (.config | ["config", "0", .digest, .mediaType, (.size | tostring)] | @tsv),
            (.layers | to_entries[] |
              ["layer", (.key | tostring), .value.digest, .value.mediaType,
               (.value.size | tostring)] | @tsv)
          ' "$public_manifest")
          export PUBLIC_REPOSITORY="$repository"
          export PUBLIC_MANIFEST_STATUS="$manifest_status"
          export PUBLIC_MANIFEST_DIGEST="$public_digest"
          export PUBLIC_MANIFEST_HEADER_DIGEST="$header_digest"
          export PUBLIC_MANIFEST_MEDIA_TYPE="$manifest_media_type"
          export PUBLIC_MANIFEST_RESPONSE_CONTENT_TYPE="$response_content_type"
          export PUBLIC_MANIFEST_SIZE="$(stat -c%s "$public_manifest")"
          export PUBLIC_REGISTRY_OBSERVED_AT="$registry_observed_at"
          export PUBLIC_BLOB_PROOFS="$blob_proofs"
          proof_path="$RUNNER_TEMP/v207-anonymous-publication-proof.json"
          export PUBLIC_PROOF_PATH="$proof_path"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          rows = []
          for line in Path(os.environ["PUBLIC_BLOB_PROOFS"]).read_text(encoding="utf-8").splitlines():
              kind, index, digest, media_type, declared, observed, content_hash, status, observed_at = line.split("\t")
              rows.append({
                  "kind": kind,
                  "index": int(index),
                  "digest": digest,
                  "media_type": media_type,
                  "declared_size_bytes": int(declared),
                  "observed_size_bytes": int(observed),
                  "content_sha256": content_hash,
                  "http_status": int(status),
                  "registry_observed_at": observed_at,
              })
          config = [item for item in rows if item["kind"] == "config"]
          layers = sorted(
              (item for item in rows if item["kind"] == "layer"),
              key=lambda item: item["index"],
          )
          if len(config) != 1 or config[0]["index"] != 0 or not layers:
              raise SystemExit("anonymous public blob proof set is incomplete")
          if [item["index"] for item in layers] != list(range(len(layers))):
              raise SystemExit("anonymous public layer proof order is invalid")
          proof = {
              "schema_version": "videoforge-anonymous-ghcr-publication-proof/v1",
              "registry": "ghcr.io",
              "repository": os.environ["PUBLIC_REPOSITORY"],
              "authentication": "GHCR_ANONYMOUS_PULL_TOKEN",
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_name": "mage-image",
              "workflow_ref": os.environ["GITHUB_REF"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "registry_observed_at": os.environ["PUBLIC_REGISTRY_OBSERVED_AT"],
              "manifest": {
                  "digest": os.environ["PUBLIC_MANIFEST_DIGEST"],
                  "header_digest": os.environ["PUBLIC_MANIFEST_HEADER_DIGEST"],
                  "content_sha256": os.environ["PUBLIC_MANIFEST_DIGEST"],
                  "media_type": os.environ["PUBLIC_MANIFEST_MEDIA_TYPE"],
                  "response_content_type": os.environ["PUBLIC_MANIFEST_RESPONSE_CONTENT_TYPE"],
                  "size_bytes": int(os.environ["PUBLIC_MANIFEST_SIZE"]),
                  "http_status": int(os.environ["PUBLIC_MANIFEST_STATUS"]),
              },
              "config": config[0],
              "layers": layers,
              "all_blobs_verified": True,
          }
          canonical = json.dumps(proof, sort_keys=True, separators=(",", ":")).encode()
          proof["proof_sha256"] = "sha256:" + hashlib.sha256(canonical).hexdigest()
          Path(os.environ["PUBLIC_PROOF_PATH"]).write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          unset anonymous_token
          echo "MAGE_ANONYMOUS_PUBLICATION_PROOF_PATH=$proof_path" >> "$GITHUB_ENV"
          echo "anonymous_public_pull=passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Write durable Mage deployability evidence
        id: record
        if: ${{ success() }}
        shell: bash
        env:
          PUBLICATION_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          published = os.environ["PUBLICATION_REQUESTED"] == "true"
          manifest_digest = os.environ["MAGE_EXPECTED_MANIFEST_DIGEST"]
          anonymous_proof = (
              json.loads(
                  Path(os.environ["MAGE_ANONYMOUS_PUBLICATION_PROOF_PATH"]).read_text(
                      encoding="utf-8"
                  )
              )
              if published
              else None
          )
          record = {
              "schema_version": "videoforge-image-deployability/v2",
              "checkpoint": "V2-07",
              "lane": "mage_image",
              "source_commit": os.environ["GITHUB_SHA"],
              "platform": "linux/amd64",
              "registry_repository": "pala-lakshmansai/videoforge-mage-v2-07",
              "publication_requested": published,
              "published": published,
              "publication_state": os.environ.get("MAGE_PUBLICATION_STATE") if published else None,
              "status": "PUBLISHED_IMMUTABLE_IMAGE" if published else "BUILD_ONLY_VERIFIED",
              "qualification_status": "REQUIRES_FRESH_LIVE_REQUALIFICATION",
              "prior_qualification_reused": False,
              "immutable_image": (
                  f"ghcr.io/pala-lakshmansai/videoforge-mage-v2-07@{manifest_digest}"
                  if published else None
              ),
              "manifest_digest": manifest_digest,
              "config_digest": os.environ["MAGE_EXPECTED_CONFIG_DIGEST"],
              "layer_digest": os.environ["MAGE_EXPECTED_LAYER_DIGEST"],
              "anonymous_publication_proof": anonymous_proof,
              "parent_image": (
                  "ghcr.io/pala-lakshmansai/videoforge-mage-v2-07@"
                  "sha256:91ef608fbb15bc69213c73a598a8915fa4dfa938d02c619454e42319a6475f62"
              ),
              "source_sha256": {
                  "packages/contracts/python/videoforge_contracts/_schema_documents.py": (
                      "sha256:08fd73862b7d79f685dfaf1b72dd6b1e41468f3f581ad766ffea1f85c9dbf66f"
                  ),
                  "workers/common/serverless_envelope.py": (
                      "sha256:34949be02521ec896c27794ad382cfa4d2bd6f1b799615716a5dc2b9ce2e41d0"
                  ),
                  "workers/image-media/mage_serverless.py": (
                      "sha256:026f2e9444d8a020a36282c36f7d0bd0931e74cf8bcea08430ffbe33412f87bd"
                  ),
              },
              "model_volume": "/runpod-volume",
              "model_volume_access": "sealed_read_only_required_at_worker_start",
              "model_download_performed": False,
              "provider_endpoint_mutation_performed": False,
          }
