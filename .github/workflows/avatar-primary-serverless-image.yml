name: avatar-primary-serverless-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified V2-08 SoulX Serverless image"
        required: true
        type: boolean
        default: false
      registry_repository:
        description: "Allowlisted immutable-image destination"
        required: true
        type: choice
        options:
          - pala-lakshmansai/videoforge-soulx-serverless-v2-08
        default: pala-lakshmansai/videoforge-soulx-serverless-v2-08
      expected_existing_digest:
        description: "Exact post-publication digest required only for an idempotent same-commit rerun"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: avatar-primary-serverless-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      immutable_image: ${{ steps.record.outputs.immutable_image }}
      image_digest: ${{ steps.record.outputs.image_digest }}
      published: ${{ steps.record.outputs.published }}
      deployability_record_sha256: ${{ steps.record.outputs.deployability_record_sha256 }}
      evidence_artifact: ${{ steps.record.outputs.evidence_artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify exact V2-08 image-definition inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.registry_repository }}" = \
            "pala-lakshmansai/videoforge-soulx-serverless-v2-08"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(sha256sum workers/avatar-primary/Dockerfile.serverless | awk '{print $1}')" = \
            "bb8249c300f55e334912e75048497eeafffe41ac74f670ef01c105710d4c65bd"
          test "$(sha256sum workers/avatar-primary/requirements.serverless.txt | awk '{print $1}')" = \
            "938ecd5c4e620ce6b3d857026748c570bb90de0678db8e4357844f32b79370c5"
          expected_sources=(
            "workers/avatar-primary/soulx_serverless.py|268be251e9a60200d7eb2b0899d3e1b962c9222b235d2c876d97460c6ca37ad9|/opt/videoforge/soulx_serverless.py"
            "workers/avatar-primary/soulx-serverless-entrypoint.py|bde3ec146ffe31e891fdbe6bf9d21de065646c20f0ef2e0885e753d2850a0bb9|/opt/videoforge/soulx-serverless-entrypoint.py"
            "workers/common/secure_scratch.py|7dafb7f17682f0c15158c39bd644f2aff16dcf614bb9ecb2ed747379eaebd775|/opt/videoforge/common/secure_scratch.py"
            "workers/common/serverless_envelope.py|34949be02521ec896c27794ad382cfa4d2bd6f1b799615716a5dc2b9ce2e41d0|/opt/videoforge/common/serverless_envelope.py"
            "packages/contracts/python/videoforge_contracts/_schema_documents.py|6b20bfeac282bd8fd43291abb18cfe2cf7c46a352a58da006f57738307c9b7d6|/opt/videoforge/src/videoforge_contracts/_schema_documents.py"
          )
          for source_entry in "${expected_sources[@]}"; do
            IFS='|' read -r source_path expected_hash image_path <<<"$source_entry"
            test "$(sha256sum "$source_path" | awk '{print $1}')" = "$expected_hash"
            grep -F "${expected_hash} ${image_path}" \
              workers/avatar-primary/Dockerfile.serverless >/dev/null
          done
          expected_contract_dependencies=(
            "packages/contracts/python/videoforge_contracts/__init__.py|83650cf6430fd82e26c855df5f91b34cf5a4eda2beebf7650d8cf86e27f88443"
            "packages/contracts/python/videoforge_contracts/models.py|b31ebc93f99c055c0ab158b72027d652ae9cbb4b232562167672cdde35c63c09"
            "packages/contracts/python/videoforge_contracts/validator.py|88e5d7a6023f10c46be3be34204539231c4eee57f14519788952b3a4a686adca"
          )
          for source_entry in "${expected_contract_dependencies[@]}"; do
            IFS='|' read -r source_path expected_hash <<<"$source_entry"
            test "$(sha256sum "$source_path" | awk '{print $1}')" = "$expected_hash"
          done

      - name: Build exact linux-amd64 candidate without a model volume
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "X64"
          build_context="$RUNNER_TEMP/v208-soulx-serverless-context"
          mkdir -p \
            "$build_context/workers/avatar-primary" \
            "$build_context/workers/common" \
            "$build_context/packages/contracts/python/videoforge_contracts"
          cp -- \
            workers/avatar-primary/Dockerfile.serverless \
            workers/avatar-primary/requirements.serverless.txt \
            workers/avatar-primary/soulx_serverless.py \
            workers/avatar-primary/soulx-serverless-entrypoint.py \
            "$build_context/workers/avatar-primary/"
          cp -- workers/common/secure_scratch.py workers/common/serverless_envelope.py \
            "$build_context/workers/common/"
          cp -- \
            packages/contracts/python/videoforge_contracts/__init__.py \
            packages/contracts/python/videoforge_contracts/_schema_documents.py \
            packages/contracts/python/videoforge_contracts/models.py \
            packages/contracts/python/videoforge_contracts/validator.py \
            "$build_context/packages/contracts/python/videoforge_contracts/"
          local_image="videoforge-soulx-serverless-v2-08:${GITHUB_SHA}"
          docker build \
            --platform linux/amd64 \
            --build-arg "VIDEOFORGE_SOURCE_COMMIT=$GITHUB_SHA" \
            --file "$build_context/workers/avatar-primary/Dockerfile.serverless" \
            --tag "$local_image" \
            "$build_context"
          test "$(docker image inspect --format='{{.Architecture}}' "$local_image")" = "amd64"
          test "$(docker image inspect --format='{{.Os}}' "$local_image")" = "linux"
          test "$(docker image inspect --format='{{index .Config.Labels \"ai.videoforge.lane\"}}' "$local_image")" = \
            "soulx_avatar"
          test "$(docker image inspect --format='{{index .Config.Labels \"ai.videoforge.runtime-profile\"}}' "$local_image")" = \
            "videoforge_soulx_flashhead_pro_bf16_v1"
          test "$(docker image inspect --format='{{index .Config.Labels \"ai.videoforge.source-commit\"}}' "$local_image")" = \
            "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/sh "$local_image" -c \
            'test ! -e /runpod-volume/soulx-flashhead-pro && test -x /usr/bin/ffprobe'
          docker run --rm --entrypoint python "$local_image" -c \
            'import soulx_serverless; assert callable(soulx_serverless.handler)'
          local_image_id="$(docker image inspect --format='{{.Id}}' "$local_image")"
          [[ "$local_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "SOULX_LOCAL_IMAGE=$local_image" >> "$GITHUB_ENV"
          echo "SOULX_LOCAL_IMAGE_ID=$local_image_id" >> "$GITHUB_ENV"
          echo "SOULX_PUBLISHED=false" >> "$GITHUB_ENV"
          echo "SOULX_IMMUTABLE_IMAGE=" >> "$GITHUB_ENV"
          echo "SOULX_IMAGE_DIGEST=" >> "$GITHUB_ENV"
          echo "SOULX_EXISTING_EXACT=false" >> "$GITHUB_ENV"
          echo "SOULX_PUBLICATION_STATE=" >> "$GITHUB_ENV"
          echo "local_image_id=$local_image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "publication_requested=${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"
          echo "provider_endpoint_mutation=false" >> "$GITHUB_STEP_SUMMARY"
          echo "qualification_status=REQUIRES_FRESH_LIVE_REQUALIFICATION" >> "$GITHUB_STEP_SUMMARY"
          echo "prior_qualification_reused=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate and reject any unbound same-commit tag
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_EXISTING_DIGEST: ${{ inputs.expected_existing_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY_OWNER,,}" = "pala-lakshmansai"
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          repository="pala-lakshmansai/videoforge-soulx-serverless-v2-08"
          tag="$GITHUB_SHA"
          expected_existing_digest="$EXPECTED_EXISTING_DIGEST"
          if [[ -n "$expected_existing_digest" ]]; then
            [[ "$expected_existing_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi
          registry_token="$(
            {
              printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN"
              printf 'url = "%s"\n' \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull,push"
            } | curl --config - --fail --silent --show-error | jq -r '.token'
          )"
          test -n "$registry_token"
          existing_manifest="$RUNNER_TEMP/v208-existing-manifest.json"
          existing_headers="$RUNNER_TEMP/v208-existing-manifest.headers"
          status="$(
            printf 'header = "Authorization: Bearer %s"\n' "$registry_token" | \
              curl --config - --silent --show-error \
                -D "$existing_headers" -o "$existing_manifest" -w '%{http_code}' \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${repository}/manifests/$tag"
          )"
          if [[ "$status" = "200" ]]; then
            existing_digest="sha256:$(sha256sum "$existing_manifest" | awk '{print $1}')"
            header_digest="$(awk 'BEGIN { IGNORECASE=1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2 }' "$existing_headers" | tail -1)"
            test -n "$expected_existing_digest"
            test "$existing_digest" = "$expected_existing_digest"
            test "$header_digest" = "$expected_existing_digest"
            digest_manifest="$RUNNER_TEMP/v208-existing-digest-manifest.json"
            digest_headers="$RUNNER_TEMP/v208-existing-digest-manifest.headers"
            printf 'header = "Authorization: Bearer %s"\n' "$registry_token" | \
              curl --config - --fail --silent --show-error -L -D "$digest_headers" \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${repository}/manifests/$expected_existing_digest" \
                -o "$digest_manifest"
            test "sha256:$(sha256sum "$digest_manifest" | awk '{print $1}')" = \
              "$expected_existing_digest"
            test "$(awk 'BEGIN { IGNORECASE=1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2 }' "$digest_headers" | tail -1)" = \
              "$expected_existing_digest"
            cmp -s "$existing_manifest" "$digest_manifest"
            existing_config_digest="$(jq -r '.config.digest' "$digest_manifest")"
            existing_config_size="$(jq -r '.config.size' "$digest_manifest")"
            [[ "$existing_config_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$existing_config_size" =~ ^[1-9][0-9]*$ ]]
            existing_config="$RUNNER_TEMP/v208-existing-config.json"
            printf 'header = "Authorization: Bearer %s"\n' "$registry_token" | \
              curl --config - --fail --silent --show-error -L \
                "https://ghcr.io/v2/${repository}/blobs/$existing_config_digest" \
                -o "$existing_config"
            test "sha256:$(sha256sum "$existing_config" | awk '{print $1}')" = \
              "$existing_config_digest"
            test "$(stat -c%s "$existing_config")" = "$existing_config_size"
            test "$(jq -r '.architecture' "$existing_config")" = "amd64"
            test "$(jq -r '.os' "$existing_config")" = "linux"
            test "$(jq -r '.config.Labels[\"ai.videoforge.source-commit\"]' "$existing_config")" = \
              "$GITHUB_SHA"
            test "$(jq -r '.config.Labels[\"org.opencontainers.image.revision\"]' "$existing_config")" = \
              "$GITHUB_SHA"
            test "$(jq -r '.config.Labels[\"org.opencontainers.image.base.name\"]' "$existing_config")" = \
              "ghcr.io/pala-lakshmansai/videoforge-soulx-flashhead-pro-vf924s"
            test "$(jq -r '.config.Labels[\"org.opencontainers.image.base.digest\"]' "$existing_config")" = \
              "sha256:0538d16199f04cac0a68ad4570b3fc260470b079200da025fe8f36640fb69a9b"
            test "$(jq -r '.config.Labels[\"ai.videoforge.lane\"]' "$existing_config")" = \
              "soulx_avatar"
            test "$(jq -r '.config.Labels[\"ai.videoforge.runtime-profile\"]' "$existing_config")" = \
              "videoforge_soulx_flashhead_pro_bf16_v1"
            test "$(jq -r '.config.Labels[\"ai.videoforge.source-revision\"]' "$existing_config")" = \
              "9bc03de06bb0de82cd6bc477804512ae06144bf2"
            test "$(jq -r '.config.Labels[\"ai.videoforge.model-revision\"]' "$existing_config")" = \
              "59119b6c681230c3eeee157e224ae1941746711e"
            test "$(jq -r '.config.Labels[\"ai.videoforge.model-manifest\"]' "$existing_config")" = \
              "sha256:995a8e478b6a3265d5a116ca283229ad0d358a5348f16f851dc0fed564bf5626"
            remote_image="ghcr.io/${repository}@$expected_existing_digest"
            docker pull "$remote_image" >/dev/null
            test "$(docker image inspect --format='{{index .Config.Labels \"ai.videoforge.source-commit\"}}' "$remote_image")" = "$GITHUB_SHA"
            docker run --rm --entrypoint /bin/sh "$remote_image" -c \
              'printf "%s  %s\n" \
                268be251e9a60200d7eb2b0899d3e1b962c9222b235d2c876d97460c6ca37ad9 /opt/videoforge/soulx_serverless.py \
                bde3ec146ffe31e891fdbe6bf9d21de065646c20f0ef2e0885e753d2850a0bb9 /opt/videoforge/soulx-serverless-entrypoint.py \
                7dafb7f17682f0c15158c39bd644f2aff16dcf614bb9ecb2ed747379eaebd775 /opt/videoforge/common/secure_scratch.py \
                34949be02521ec896c27794ad382cfa4d2bd6f1b799615716a5dc2b9ce2e41d0 /opt/videoforge/common/serverless_envelope.py \
                6b20bfeac282bd8fd43291abb18cfe2cf7c46a352a58da006f57738307c9b7d6 /opt/videoforge/src/videoforge_contracts/_schema_documents.py \
                | sha256sum --check --strict'
            echo "SOULX_EXISTING_EXACT=true" >> "$GITHUB_ENV"
            echo "SOULX_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "SOULX_IMMUTABLE_IMAGE=$remote_image" >> "$GITHUB_ENV"
            echo "SOULX_IMAGE_DIGEST=$expected_existing_digest" >> "$GITHUB_ENV"
            echo "SOULX_PUBLICATION_STATE=EXACT_EXISTING_DIGEST_REUSED" >> "$GITHUB_ENV"
          else
            test "$status" = "404"
            test -z "$expected_existing_digest"
          fi
          unset registry_token

      - name: Publish only to the exact allowlisted repository
        if: ${{ inputs.publish && env.SOULX_EXISTING_EXACT != 'true' }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="${{ inputs.registry_repository }}"
          test "$repository" = "pala-lakshmansai/videoforge-soulx-serverless-v2-08"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          tagged_image="ghcr.io/${repository}:${GITHUB_SHA}"
          docker tag "$SOULX_LOCAL_IMAGE" "$tagged_image"
          push_output="$(docker push "$tagged_image" 2>&1)"
          push_digest="$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' <<<"$push_output" | tail -1)"
          [[ "$push_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          registry_token="$(
            {
              printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN"
              printf 'url = "%s"\n' \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull,push"
            } | curl --config - --fail --silent --show-error | jq -r '.token'
          )"
          remote_manifest="$RUNNER_TEMP/v208-published-manifest.json"
          remote_headers="$RUNNER_TEMP/v208-published-manifest.headers"
          printf 'header = "Authorization: Bearer %s"\n' "$registry_token" | \
            curl --config - --fail --silent --show-error -L -D "$remote_headers" \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/$GITHUB_SHA" \
              -o "$remote_manifest"
          image_digest="sha256:$(sha256sum "$remote_manifest" | awk '{print $1}')"
          header_digest="$(awk 'BEGIN { IGNORECASE=1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2 }' "$remote_headers" | tail -1)"
          test "$image_digest" = "$push_digest"
          test "$header_digest" = "$push_digest"
          test "$(jq -r '.config.digest' "$remote_manifest")" = "$SOULX_LOCAL_IMAGE_ID"
          immutable_image="ghcr.io/${repository}@$image_digest"
          [[ "$immutable_image" =~ ^ghcr\.io/pala-lakshmansai/videoforge-soulx-serverless-v2-08@sha256:[a-f0-9]{64}$ ]]
          docker pull "$immutable_image" >/dev/null
          test "$(docker image inspect --format='{{index .Config.Labels \"ai.videoforge.source-commit\"}}' "$immutable_image")" = "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/sh "$immutable_image" -c \
            'printf "%s  %s\n" \
              268be251e9a60200d7eb2b0899d3e1b962c9222b235d2c876d97460c6ca37ad9 /opt/videoforge/soulx_serverless.py \
              bde3ec146ffe31e891fdbe6bf9d21de065646c20f0ef2e0885e753d2850a0bb9 /opt/videoforge/soulx-serverless-entrypoint.py \
              7dafb7f17682f0c15158c39bd644f2aff16dcf614bb9ecb2ed747379eaebd775 /opt/videoforge/common/secure_scratch.py \
              34949be02521ec896c27794ad382cfa4d2bd6f1b799615716a5dc2b9ce2e41d0 /opt/videoforge/common/serverless_envelope.py \
              6b20bfeac282bd8fd43291abb18cfe2cf7c46a352a58da006f57738307c9b7d6 /opt/videoforge/src/videoforge_contracts/_schema_documents.py \
              | sha256sum --check --strict'
          unset registry_token
          echo "SOULX_PUBLISHED=true" >> "$GITHUB_ENV"
          echo "SOULX_IMMUTABLE_IMAGE=$immutable_image" >> "$GITHUB_ENV"
          echo "SOULX_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          echo "SOULX_PUBLICATION_STATE=PUBLISHED_NEW_DIGEST" >> "$GITHUB_ENV"

      - name: Remove registry credentials
        if: ${{ always() && inputs.publish }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Prove anonymous public pull visibility of exact SoulX digest
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          repository="pala-lakshmansai/videoforge-soulx-serverless-v2-08"
          anonymous_token="$(
            curl -fsSL \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
              | jq -r '.token'
          )"
          test -n "$anonymous_token"
          public_manifest="$RUNNER_TEMP/v208-public-manifest.json"
          public_headers="$RUNNER_TEMP/v208-public-manifest.headers"
          curl -fsSL -D "$public_headers" \
            -H "Authorization: Bearer $anonymous_token" \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/$SOULX_IMAGE_DIGEST" \
            -o "$public_manifest"
          public_digest="sha256:$(sha256sum "$public_manifest" | awk '{print $1}')"
          header_digest="$(awk 'BEGIN { IGNORECASE=1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2 }' "$public_headers" | tail -1)"
          test "$public_digest" = "$SOULX_IMAGE_DIGEST"
          test "$header_digest" = "$SOULX_IMAGE_DIGEST"
          while IFS= read -r blob; do
            [[ "$blob" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$(curl -sS -L -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer $anonymous_token" \
              "https://ghcr.io/v2/${repository}/blobs/$blob")" = "200"
          done < <(jq -r '.config.digest, .layers[].digest' "$public_manifest")
          unset anonymous_token
          echo "anonymous_public_pull=passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Write deployability and publication evidence
        id: record
        if: ${{ success() }}
        shell: bash
        env:
          PUBLICATION_REQUESTED: ${{ inputs.publish }}
          REGISTRY_REPOSITORY: ${{ inputs.registry_repository }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          published = os.environ["SOULX_PUBLISHED"] == "true"
          record = {
              "schema_version": "videoforge-image-deployability/v1",
              "checkpoint": "V2-08",
              "lane": "soulx_avatar",
              "source_commit": os.environ["GITHUB_SHA"],
              "platform": "linux/amd64",
              "registry_repository": os.environ["REGISTRY_REPOSITORY"],
              "publication_requested": os.environ["PUBLICATION_REQUESTED"] == "true",
              "published": published,
              "publication_state": os.environ["SOULX_PUBLICATION_STATE"] or None,
              "status": "PUBLISHED_IMMUTABLE_IMAGE" if published else "BUILD_ONLY_VERIFIED",
              "qualification_status": "REQUIRES_FRESH_LIVE_REQUALIFICATION",
              "prior_qualification_reused": False,
              "local_image_id": os.environ["SOULX_LOCAL_IMAGE_ID"],
              "immutable_image": os.environ["SOULX_IMMUTABLE_IMAGE"] or None,
              "image_digest": os.environ["SOULX_IMAGE_DIGEST"] or None,
              "dockerfile_sha256": (
                  "sha256:bb8249c300f55e334912e75048497eeafffe41ac74f670ef01c105710d4c65bd"
              ),
              "requirements_sha256": (
                  "sha256:938ecd5c4e620ce6b3d857026748c570bb90de0678db8e4357844f32b79370c5"
              ),
              "base_image": (
                  "ghcr.io/pala-lakshmansai/videoforge-soulx-flashhead-pro-vf924s@"
                  "sha256:0538d16199f04cac0a68ad4570b3fc260470b079200da025fe8f36640fb69a9b"
              ),
              "source_sha256": {
                  "packages/contracts/python/videoforge_contracts/_schema_documents.py": (
                      "sha256:6b20bfeac282bd8fd43291abb18cfe2cf7c46a352a58da006f57738307c9b7d6"
                  ),
                  "packages/contracts/python/videoforge_contracts/__init__.py": (
                      "sha256:83650cf6430fd82e26c855df5f91b34cf5a4eda2beebf7650d8cf86e27f88443"
                  ),
                  "packages/contracts/python/videoforge_contracts/models.py": (
                      "sha256:b31ebc93f99c055c0ab158b72027d652ae9cbb4b232562167672cdde35c63c09"
                  ),
                  "packages/contracts/python/videoforge_contracts/validator.py": (
                      "sha256:88e5d7a6023f10c46be3be34204539231c4eee57f14519788952b3a4a686adca"
                  ),
                  "workers/avatar-primary/soulx-serverless-entrypoint.py": (
