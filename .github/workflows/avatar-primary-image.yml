name: avatar-primary-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the smoke-tested immutable CP-07 Echo Flash Turbo FP8 image to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: avatar-primary-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      immutable_image: ${{ steps.publish.outputs.immutable_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim only disposable hosted-runner tool space
        shell: bash
        run: |
          set -euo pipefail
          for target in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [[ -e "$target" ]]; then
              sudo rm -rf -- "$target"
            fi
          done
          docker system prune --all --force

      - name: Build and smoke immutable CP-07 Echo Flash Turbo FP8 Pod worker
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "X64"
          image="videoforge-echo-flash-turbo-cp07:${GITHUB_SHA}"
          docker build --tag "$image" workers/avatar-primary
          docker run --rm --entrypoint python "$image" -c \
            'import torch, torchao; import echo_api, echo_volume, span_contract; assert torch.__version__.split("+")[0] == "2.7.1"; assert torchao.__version__ == "0.11.0"; assert echo_api.runtime.health()["model"]["status"] == "loading"; print("echo-cp07-import-health-ok")'
          docker run --rm --entrypoint python "$image" -m compileall -q /opt/echomimic_v3 /opt/videoforge
          image_id="$(docker image inspect --format='{{.Id}}' "$image")"
          echo "LOCAL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "image_id=$image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "publication_requested=${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate GHCR
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish smoke-tested immutable image
        id: publish
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/videoforge-echo-flash-turbo-cp07:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image"
          docker push "$image"
          immutable_image="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          [[ "$immutable_image" =~ ^ghcr\.io/[a-z0-9_-]+/videoforge-echo-flash-turbo-cp07@sha256:[a-f0-9]{64}$ ]]
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "immutable_image=$immutable_image" >> "$GITHUB_STEP_SUMMARY"
