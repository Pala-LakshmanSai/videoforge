name: avatar-primary-image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the smoke-tested immutable SoulX-FlashHead Pro image to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: avatar-primary-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      immutable_image: ${{ steps.publish.outputs.immutable_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim only disposable hosted-runner tool space
        shell: bash
        run: |
          set -euo pipefail
          for target in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [[ -e "$target" ]]; then
              sudo rm -rf -- "$target"
            fi
          done
          docker system prune --all --force

      - name: Build and smoke immutable SoulX-FlashHead Pro Pod worker
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = "X64"
          image="videoforge-soulx-flashhead-pro-vf924s:${GITHUB_SHA}"
          docker build --tag "$image" workers/avatar-primary
          docker run --rm --entrypoint /bin/sh "$image" -c 'test -x /usr/bin/gcc && test -x /usr/bin/g++'
          docker run --rm --entrypoint python "$image" -c \
            'import torch, flash_attn; import soulx_api, soulx_volume; assert torch.__version__.split("+")[0] == "2.7.1"; assert soulx_api.runtime.health()["state"] == "loading"; assert soulx_volume.expected_manifest()["total_bytes"] == 6916084703; print("soulx-vf924s-import-health-ok")'
          docker run --rm --entrypoint python "$image" -m compileall -q /opt/soulx-flashhead /opt/videoforge
          image_id="$(docker image inspect --format='{{.Id}}' "$image")"
          echo "LOCAL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "image_id=$image_id" >> "$GITHUB_STEP_SUMMARY"
          echo "publication_requested=${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate GHCR
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish smoke-tested immutable image
        id: publish
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/videoforge-soulx-flashhead-pro-vf924s:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image"
          docker push "$image"
          immutable_image="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          [[ "$immutable_image" =~ ^ghcr\.io/[a-z0-9_-]+/videoforge-soulx-flashhead-pro-vf924s@sha256:[a-f0-9]{64}$ ]]
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "immutable_image=$immutable_image" >> "$GITHUB_STEP_SUMMARY"
