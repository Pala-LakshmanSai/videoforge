name: avatar-primary-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avatar-primary-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build, smoke, and publish pinned worker
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/videoforge-avatar-primary:${GITHUB_SHA}"
          docker build --tag "$image" workers/avatar-primary
          docker run --rm --entrypoint python "$image" -c \
            'import librosa, moviepy, pyloudnorm, runpod, torch, torchvision; from videoforge_avatar_primary import AvatarPrimaryJob; print("avatar-primary-import-ok")'
          docker run --rm --entrypoint python "$image" infer_flash.py --help >/dev/null
          docker run --rm --entrypoint python "$image" -c \
            'import sys; sys.path.insert(0, "/opt/videoforge"); import handler; observed = []; handler.runpod.serverless.start = lambda config: observed.append(config); handler.start_worker(); assert len(observed) == 1 and callable(observed[0]["handler"]); print("avatar-primary-handler-registration-ok")'
          docker run --rm -e VIDEOFORGE_WORKER_STARTUP_SMOKE=1 "$image" | \
            grep '"event": "avatar_primary_startup_smoke_ok"'
          docker run --rm --entrypoint python "$image" -m compileall -q /opt/echomimic_v3 /opt/videoforge
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          printf 'image=%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
