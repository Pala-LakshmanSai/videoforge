name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_contracts_security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run static, contract, and repository security checks
        shell: bash
        run: |
          started=$SECONDS
          finish() {
            status=$?
            mkdir -p ci-artifacts
            printf 'wall_seconds=%s\nexit_code=%s\n' "$((SECONDS - started))" "$status" > ci-artifacts/static-timing.txt
            trap - EXIT
            exit "$status"
          }
          trap finish EXIT
          pnpm ci:static
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - name: Upload static timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/static-timing.txt
          if-no-files-found: warn
          retention-days: 14

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run TypeScript graph
        shell: bash
        run: |
          started=$SECONDS
          finish() {
            status=$?
            mkdir -p ci-artifacts
            printf 'wall_seconds=%s\nexit_code=%s\n' "$((SECONDS - started))" "$status" > ci-artifacts/typescript-timing.txt
            trap - EXIT
            exit "$status"
          }
          trap finish EXIT
          pnpm ci:typescript
      - name: Upload TypeScript timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/typescript-timing.txt
          if-no-files-found: warn
          retention-days: 14

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check uv==0.8.13
      - run: pnpm python:sync
      - name: Run Python graph
        shell: bash
        run: |
          started=$SECONDS
          finish() {
            status=$?
            mkdir -p ci-artifacts
            printf 'wall_seconds=%s\nexit_code=%s\n' "$((SECONDS - started))" "$status" > ci-artifacts/python-timing.txt
            trap - EXIT
            exit "$status"
          }
          trap finish EXIT
          pnpm ci:python
      - name: Upload Python timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/python-timing.txt
          if-no-files-found: warn
          retention-days: 14

  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @videoforge/web exec playwright install --with-deps chromium
      - name: Run local Workerd parity
        shell: bash
        run: |
          started=$SECONDS
          finish() {
            status=$?
            mkdir -p ci-artifacts
            printf 'wall_seconds=%s\nexit_code=%s\n' "$((SECONDS - started))" "$status" > ci-artifacts/workerd-timing.txt
            trap - EXIT
            exit "$status"
          }
          trap finish EXIT
          pnpm test:cloudflare-runtime
      - name: Upload Workerd timing and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workerd-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/workerd-timing.txt
            apps/web/test-results
            apps/web/playwright-workerd-report
          if-no-files-found: warn
          retention-days: 14

  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @videoforge/web exec playwright install --with-deps chrome
      - name: Run installed-Chrome journeys
        shell: bash
        run: |
          started=$SECONDS
          finish() {
            status=$?
            mkdir -p ci-artifacts
            printf 'wall_seconds=%s\nexit_code=%s\n' "$((SECONDS - started))" "$status" > ci-artifacts/chrome-timing.txt
            trap - EXIT
            exit "$status"
          }
          trap finish EXIT
          pnpm test:chrome
      - name: Upload Chrome timing, JUnit, and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/chrome-timing.txt
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14

  required:
    if: always()
    needs: [static_contracts_security, typescript, python, workerd, chrome]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification lane
        env:
          STATIC_RESULT: ${{ needs.static_contracts_security.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WORKERD_RESULT: ${{ needs.workerd.result }}
          CHROME_RESULT: ${{ needs.chrome.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TYPESCRIPT_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$WORKERD_RESULT" = success
          test "$CHROME_RESULT" = success
