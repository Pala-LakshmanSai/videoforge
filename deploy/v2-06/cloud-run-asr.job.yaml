apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: videoforge-v2-06-asr-staging
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: __V2_06_CPU_JOB_SERVICE_ACCOUNT__
          maxRetries: 0
          timeoutSeconds: "3600"
          containers:
            - name: media-job
              image: __V2_06_MEDIA_IMAGE_DIGEST_URI__
              env:
                - name: VIDEOFORGE_CPU_JOB_KIND
                  value: ASR
              resources:
                limits:
                  cpu: "2"
                  memory: 4Gi
