      - "The desktop cancellation monitor is a real class method, renews the five-minute lease while work is active, kills the entire media process group on cancel, and is covered against the class-indentation regression."
      - "Cloud Run configuration, secrets, deployment templates, and production dispatch are removed from the active V2-06 path; historical adapter and evidence remain only for rollback/audit."
      - "The hosted product router now composes tenant-private Create/upload/commit/personal-worker ASR, durable Project/cancel, exact Review/playback, Usage, Queue, Library/Delete, Settings, and worker setup instead of stopping at the auth/status shell."
      - "Source commit f8e07b1 hardens personal-worker job UUID and size bounds, bundled CA verification for streamed uploads, post-process cancellation fencing, result-document limits, exact durable completion acknowledgement, and deterministic UPDATE_REQUIRED reinstall guidance; d6f2c44 prepares immutable release 0.1.5."
