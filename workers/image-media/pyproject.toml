[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "videoforge-image-media-worker"
version = "0.0.0"
description = "VideoForge fixture skeleton for local ASR, image, render, and probe jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "opencv-python-headless==4.10.0.84",
  "videoforge-contracts",
]

[tool.uv.sources]
videoforge-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_image_media"]

[tool.ruff]
target-version = "py312"
line-length = 100
