[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "videoforge-media-local-worker"
version = "0.0.0"
description = "Provider-free ASR/render core and zero-configuration personal media worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi==2025.7.14",
  "videoforge-contracts",
  "videoforge-image-media-worker",
]

[project.scripts]
videoforge-personal-worker = "videoforge_media_local.personal_worker:main"

[tool.uv.sources]
videoforge-contracts = { workspace = true }
videoforge-image-media-worker = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_media_local"]

[tool.ruff]
target-version = "py312"
line-length = 100
