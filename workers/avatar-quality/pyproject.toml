[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "videoforge-avatar-quality-worker"
version = "0.0.0"
description = "VideoForge fixture skeleton for cold SkyReels whole-frame fallback jobs"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_avatar_quality"]

[tool.ruff]
target-version = "py312"
line-length = 100
